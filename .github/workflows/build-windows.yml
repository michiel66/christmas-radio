
name: Christmas Radio - Windows EXE

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Christmas Radio
    runs-on: windows-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build Christmas Radio EXE
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name "Christmas Radio" --add-data "christmas_radio.png;." main.py

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: Christmas-Radio-Windows
          path: dist/Christmas Radio.exe
          if-no-files-found: error
